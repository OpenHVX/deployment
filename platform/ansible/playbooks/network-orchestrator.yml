---
- name: Apply only the network executor and its private environment
  hosts: cp[0]
  become: true
  tasks:
    - name: Select network executor resources from the rendered manifest
      ansible.builtin.set_fact:
        network_objects: "{{ lookup('ansible.builtin.file', infra_work + '/openhvx.yml') | from_yaml_all | selectattr('metadata.name', 'in', ['network-orchestrator', 'network-orchestrator-env']) | list }}"
      no_log: true
    - name: Stage private network executor manifest
      ansible.builtin.copy:
        content: "{{ {'apiVersion': 'v1', 'kind': 'List', 'items': network_objects} | to_nice_json }}"
        dest: /root/openhvx-network.yml
        mode: '0600'
      no_log: true
    - name: Apply the network executor resources
      ansible.builtin.command: k3s kubectl apply -f /root/openhvx-network.yml
    - name: Wait for network executor readiness
      ansible.builtin.command: k3s kubectl -n openhvx rollout status deployment/network-orchestrator --timeout=180s
