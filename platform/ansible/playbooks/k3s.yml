---
- name: Configure Linux prerequisites
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Wait for authenticated SSH
      ansible.builtin.wait_for_connection:
        timeout: 600
    - name: Install prerequisites
      ansible.builtin.apt:
        name: [curl, ca-certificates, chrony, python3, lvm2, podman]
        update_cache: true
        state: present
    - name: Configure infrastructure name resolution
      ansible.builtin.blockinfile:
        path: /etc/hosts
        block: |
          {% for host in groups['all'] %}
          {{ hostvars[host].ansible_host }} {{ host }}
          {% endfor %}
    - name: Enable time synchronization
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true
- name: Install HA K3s servers sequentially
  hosts: cp
  serial: 1
  become: true
  tasks:
    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0700'
    - name: Configure K3s with embedded etcd
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: '0600'
        content: |
          token: {{ k3s_token | to_json }}
          node-name: {{ inventory_hostname }}
          node-ip: {{ ansible_host }}
          flannel-iface: eth0
          write-kubeconfig-mode: "0600"
          secrets-encryption: true
          tls-san:
            - 192.168.50.20
          {% if inventory_hostname == groups['cp'][0] %}
          cluster-init: true
          {% else %}
          server: https://{{ hostvars[groups['cp'][0]].ansible_host }}:6443
          {% endif %}
      no_log: true
      register: k3s_config
    - name: Download K3s installation script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /root/install-k3s.sh
        mode: '0700'
    - name: Install pinned K3s release
      ansible.builtin.command: /root/install-k3s.sh server
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      register: k3s_install
    - name: Ensure K3s is started
      ansible.builtin.service:
        name: k3s
        enabled: true
        state: "{{ 'restarted' if k3s_config.changed and not k3s_install.changed else 'started' }}"
    - name: Verify installed K3s version
      ansible.builtin.command: k3s --version
      register: installed_k3s
      changed_when: false
      failed_when: k3s_version not in installed_k3s.stdout
    - name: Wait for server API
      ansible.builtin.wait_for:
        port: 6443
        timeout: 300
- name: Configure management endpoint failover
  hosts: cp
  become: true
  tasks:
    - name: Install keepalived
      ansible.builtin.apt:
        name: keepalived
        state: present
    - name: Configure private management VIP
      ansible.builtin.copy:
        dest: /etc/keepalived/keepalived.conf
        mode: '0600'
        content: |
          global_defs {
            enable_script_security
            script_user root
          }
          vrrp_script k3s_running {
            script "/usr/bin/systemctl is-active --quiet k3s"
            interval 2
            fall 3
            rise 2
          }
          vrrp_instance OPENHVX {
            state BACKUP
            interface eth0
            virtual_router_id 50
            priority {{ 110 - groups['cp'].index(inventory_hostname) * 10 }}
            advert_int 1
            unicast_src_ip {{ ansible_host }}
            unicast_peer {
          {% for host in groups['cp'] if host != inventory_hostname %}
              {{ hostvars[host].ansible_host }}
          {% endfor %}
            }
            virtual_ipaddress {
              192.168.50.20/24 dev eth0
            }
            track_script {
              k3s_running
            }
          }
      register: keepalived_config
    - name: Enable management endpoint failover
      ansible.builtin.service:
        name: keepalived
        enabled: true
        state: "{{ 'restarted' if keepalived_config.changed else 'started' }}"
- name: Retain control of the HA DNS manifest across K3s restarts
  hosts: cp
  become: true
  tasks:
    - name: Prevent bundled CoreDNS from resetting the managed replica count
      ansible.builtin.copy:
        dest: /var/lib/rancher/k3s/server/manifests/coredns.yaml.skip
        content: "# CoreDNS is managed by the OpenHVX deployment playbook.\n"
        mode: '0644'
- name: Deploy DNS across three failure domains
  hosts: cp[0]
  become: true
  tasks:
    - name: Copy the managed CoreDNS manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../kubernetes/coredns.yaml"
        dest: /root/openhvx-coredns.yaml
        mode: '0644'
    - name: Apply HA DNS
      ansible.builtin.command: k3s kubectl apply -f /root/openhvx-coredns.yaml
      register: dns_apply
      changed_when: "'created' in dns_apply.stdout or 'configured' in dns_apply.stdout"
    - name: Wait for DNS rollout
      ansible.builtin.command: k3s kubectl -n kube-system rollout status deployment/coredns --timeout=300s
      changed_when: false
