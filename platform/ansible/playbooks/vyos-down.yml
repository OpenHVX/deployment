---
- name: Destroy only explicitly declared and owned VyOS instances
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate ownership on all selected hosts before any deletion
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', playbook_dir + '/../../powershell/Remove-VyosVM.ps1') }}"
        parameters:
          Name: "{{ vyos_hosts[inventory_hostname].name }}"
          DeploymentId: "{{ vyos_deployment_id }}"
          Apply: false
      register: vyos_plan
    - name: Display the exact destruction targets
      ansible.builtin.debug:
        var: vyos_plan.output
    - name: Apply the validated targeted destruction
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', playbook_dir + '/../../powershell/Remove-VyosVM.ps1') }}"
        parameters:
          Name: "{{ vyos_hosts[inventory_hostname].name }}"
          DeploymentId: "{{ vyos_deployment_id }}"
          Apply: true
      when: vyos_destroy_apply | default(false) | bool
