---
- name: Seed a reusable Ubuntu image in the Ceph catalog
  hosts: ceph[0]
  become: true
  tasks:
    - name: Install disk conversion tools
      ansible.builtin.apt:
        name: qemu-utils
        state: present
    - name: Copy verified Ubuntu source image
      ansible.builtin.copy:
        src: "{{ infra_work }}/noble-server-cloudimg-amd64.img"
        dest: /root/ubuntu-24.04.qcow2
        mode: '0600'
    - name: Convert the catalog image to a raw guest disk
      ansible.builtin.command: qemu-img convert -f qcow2 -O raw /root/ubuntu-24.04.qcow2 /root/ubuntu-24.04.raw
      args:
        creates: /root/ubuntu-24.04.raw
    - name: Inspect catalog images
      ansible.builtin.command: /usr/local/sbin/cephadm shell -- rbd ls catalog --format json
      register: catalog
      changed_when: false
    - name: Import Ubuntu into Ceph
      ansible.builtin.command: /usr/local/sbin/cephadm shell --mount /root/ubuntu-24.04.raw:/root/ubuntu-24.04.raw -- rbd import /root/ubuntu-24.04.raw catalog/ubuntu-24.04
      when: "'ubuntu-24.04' not in (catalog.stdout | from_json)"
    - name: Inspect image snapshots
      ansible.builtin.command: /usr/local/sbin/cephadm shell -- rbd snap ls catalog/ubuntu-24.04 --format json
      register: snapshots
      changed_when: false
    - name: Create the reusable base snapshot
      ansible.builtin.command: /usr/local/sbin/cephadm shell -- rbd snap create catalog/ubuntu-24.04@base
      when: "'base' not in (snapshots.stdout | from_json | map(attribute='name') | list)"
    - name: Protect the base snapshot
      ansible.builtin.command: /usr/local/sbin/cephadm shell -- rbd snap protect catalog/ubuntu-24.04@base
      when: not ((snapshots.stdout | from_json | selectattr('name', 'equalto', 'base') | map(attribute='protected') | list | first | default(false)) | bool)
