---
- name: Build OpenHVX container images on the first control VM
  hosts: cp[0]
  become: true
  tasks:
    - name: Install image build engine
      ansible.builtin.apt:
        name: docker.io
        state: present
    - name: Start image build engine
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
    - name: Create build directories
      ansible.builtin.file:
        path: "/root/openhvx-build/{{ item }}"
        state: directory
        mode: '0700'
      loop: "{{ image_names | default(['auth', 'api-gateway', 'controller', 'ws-broker', 'network-orchestrator', 'ceph-connector']) }}"
    - name: Unpack source snapshots
      ansible.builtin.unarchive:
        src: "{{ infra_work }}/build/{{ item }}.tgz"
        dest: "/root/openhvx-build/{{ item }}"
      loop: "{{ image_names | default(['auth', 'api-gateway', 'controller', 'ws-broker', 'network-orchestrator', 'ceph-connector']) }}"
    - name: Build versioned application images
      ansible.builtin.command: "docker build -t openhvx/{{ item }}:{{ image_tag }} /root/openhvx-build/{{ item }}"
      loop: "{{ image_names | default(['auth', 'api-gateway', 'controller', 'ws-broker', 'network-orchestrator', 'ceph-connector']) }}"
    - name: Export immutable deployment image bundle
      ansible.builtin.shell: >-
        set -o pipefail; docker save {% for name in image_names | default(['auth','api-gateway','controller','ws-broker','network-orchestrator','ceph-connector']) %} openhvx/{{ name }}:{{ image_tag }}{% endfor %}
        | gzip > /root/openhvx-images.tar.gz
      args:
        executable: /bin/bash
    - name: Fetch bundle to deployment controller
      ansible.builtin.fetch:
        src: /root/openhvx-images.tar.gz
        dest: "{{ infra_work }}/images.tar.gz"
        flat: true
- name: Load application images into each K3s node
  hosts: cp
  become: true
  tasks:
    - name: Copy deployment image bundle
      ansible.builtin.copy:
        src: "{{ infra_work }}/images.tar.gz"
        dest: /root/openhvx-images.tar.gz
        mode: '0600'
    - name: Import images into the K3s container runtime
      ansible.builtin.command: k3s ctr images import /root/openhvx-images.tar.gz
