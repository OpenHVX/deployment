---
- name: Install Dashboard TLS material
  ansible.builtin.copy:
    src: "{{ infra_work }}/{{ item }}"
    dest: "/root/{{ item }}"
    mode: '0600'
  loop: [dashboard.crt, dashboard.key]
  register: dashboard_tls
  no_log: true
- name: Bootstrap pinned Ceph release
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/cephadm
      - --image
      - quay.io/ceph/ceph:v19.2.3
      - bootstrap
      - --mon-ip
      - "{{ ansible_host }}"
      - --initial-dashboard-user
      - openhvx
      - --initial-dashboard-password
      - "{{ ceph_dashboard_password }}"
      - --dashboard-password-noupdate
      - --dashboard-crt
      - /root/dashboard.crt
      - --dashboard-key
      - /root/dashboard.key
      - --skip-monitoring-stack
    creates: /etc/ceph/ceph.conf
  no_log: true
- name: Update Dashboard certificate after rotation
  ansible.builtin.command: /usr/local/sbin/cephadm shell --mount /root/dashboard.crt:/root/dashboard.crt -- ceph dashboard set-ssl-certificate -i /root/dashboard.crt
  when: dashboard_tls.changed
- name: Update Dashboard key after rotation
  ansible.builtin.command: /usr/local/sbin/cephadm shell --mount /root/dashboard.key:/root/dashboard.key -- ceph dashboard set-ssl-certificate-key -i /root/dashboard.key
  when: dashboard_tls.changed
  no_log: true
- name: Reload Dashboard after certificate rotation
  ansible.builtin.command: "/usr/local/sbin/cephadm shell -- ceph mgr module {{ item }} dashboard"
  loop: [disable, enable]
  when: dashboard_tls.changed
- name: Read cluster SSH public key
  ansible.builtin.slurp:
    src: /etc/ceph/ceph.pub
  register: ceph_pub
- name: Allow cephadm to manage cluster hosts
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ ceph_pub.content | b64decode | trim }}"
    create: true
    mode: '0600'
  delegate_to: "{{ item }}"
  loop: "{{ groups['ceph'] }}"
# Query before mutation. In particular, never silently repoint an existing host:
# changing an address can disconnect daemons and belongs in a maintenance plan.
- name: Read the enrolled Ceph hosts
  ansible.builtin.command: /usr/local/sbin/cephadm shell -- ceph orch host ls --format json
  register: enrolled_ceph_hosts
  changed_when: false

- name: Require existing Ceph host addresses to match the inventory
  ansible.builtin.assert:
    that: (enrolled_ceph_hosts.stdout | from_json | selectattr('hostname', 'equalto', item) | first).addr == hostvars[item].ansible_host
    fail_msg: 'An existing Ceph host has another address; inspect and plan the change explicitly.'
  when: item in (enrolled_ceph_hosts.stdout | from_json | map(attribute='hostname') | list)
  loop: "{{ groups['ceph'] }}"

- name: Enroll only missing Ceph hosts
  ansible.builtin.command: "/usr/local/sbin/cephadm shell -- ceph orch host add {{ item }} {{ hostvars[item].ansible_host }}"
  when: item not in (enrolled_ceph_hosts.stdout | from_json | map(attribute='hostname') | list)
  loop: "{{ groups['ceph'] }}"

- name: Read the current OSD memory target
  ansible.builtin.command: /usr/local/sbin/cephadm shell -- ceph config get osd osd_memory_target
  register: osd_memory_target
  changed_when: false

- name: Tune OSD memory only when it differs
  ansible.builtin.command: /usr/local/sbin/cephadm shell -- ceph config set osd osd_memory_target 2147483648
  when: osd_memory_target.stdout | trim | int != 2147483648

- name: Read the monitor placement specification
  ansible.builtin.command: /usr/local/sbin/cephadm shell -- ceph orch ls --service_name mon --export --format json
  register: monitor_specification
  changed_when: false

- name: Place three monitors when the declared count differs
  ansible.builtin.command: /usr/local/sbin/cephadm shell -- ceph orch apply mon --placement=3
  when: (monitor_specification.stdout | from_json | first).placement.count | default(0) | int != 3

- name: Read existing OSD placement
  ansible.builtin.command: /usr/local/sbin/cephadm shell -- ceph orch ps --daemon-type osd --format json
  register: existing_osds
  changed_when: false
- name: Add dedicated data disks without zapping or wiping
  ansible.builtin.command: "/usr/local/sbin/cephadm shell -- ceph orch daemon add osd {{ item }}:/dev/sdb"
  when: item not in (existing_osds.stdout | from_json | map(attribute='hostname') | list)
  loop: "{{ groups['ceph'] }}"
- name: Wait for three up OSDs
  ansible.builtin.command: /usr/local/sbin/cephadm shell -- ceph osd stat --format json
  register: osds
  until: (osds.stdout | from_json).num_up_osds | int == 3
  retries: 60
  delay: 10
  changed_when: false
- name: Read existing pools
  ansible.builtin.command: /usr/local/sbin/cephadm shell -- ceph osd pool ls --format json
  register: pools
  changed_when: false
- name: Create RBD pools
  ansible.builtin.command: "/usr/local/sbin/cephadm shell -- ceph osd pool create {{ item }}"
  when: item not in (pools.stdout | from_json)
  loop: [rbd, catalog]
- name: Read pool application metadata
  ansible.builtin.command: "/usr/local/sbin/cephadm shell -- ceph osd pool application get {{ item }} --format json"
  loop: [rbd, catalog]
  register: pool_applications
  changed_when: false

- name: Initialize pools that are not yet marked for RBD
  ansible.builtin.command: "/usr/local/sbin/cephadm shell -- rbd pool init {{ item.item }}"
  loop: "{{ pool_applications.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'rbd' not in (item.stdout | from_json)"

- name: Render iSCSI service specification
  ansible.builtin.copy:
    dest: /root/openhvx-iscsi.yml
    mode: '0600'
    content: |
      service_type: iscsi
      service_id: openhvx
      placement:
        hosts: {{ groups['ceph'] | to_json }}
      spec:
        pool: rbd
        api_user: openhvx
        api_password: {{ ceph_iscsi_password | to_json }}
        api_secure: false
        trusted_ip_list: {{ (groups['ceph'] | map('extract', hostvars, 'ansible_host') | list) | join(',') }}
  no_log: true

# Retrying an unchanged spec is not a mutation. A changed file is applied once;
# if application fails, the next run must still retry. Compare the live service
# with the intended fields instead of using a local 'last applied' marker.
- name: Read the live iSCSI service specification
  ansible.builtin.command: /usr/local/sbin/cephadm shell -- ceph orch ls --service_name iscsi.openhvx --export --format json
  register: live_iscsi_service
  changed_when: false
  no_log: true

- name: Decode the live and desired iSCSI specifications
  ansible.builtin.set_fact:
    desired_iscsi: "{{ {'pool': 'rbd', 'api_user': 'openhvx', 'api_password': ceph_iscsi_password, 'api_secure': false, 'trusted_ip_list': (groups['ceph'] | map('extract', hostvars, 'ansible_host') | list) | join(',')} }}"
    live_iscsi: "{{ (live_iscsi_service.stdout | from_json | first) | default({}) }}"
  no_log: true

- name: Apply the iSCSI service only when managed settings differ
  ansible.builtin.command: /usr/local/sbin/cephadm shell --mount /root/openhvx-iscsi.yml:/root/openhvx-iscsi.yml -- ceph orch apply -i /root/openhvx-iscsi.yml
  when: >-
    (live_iscsi.placement.hosts | default([]) | sort) != (groups['ceph'] | sort)
    or (live_iscsi.spec | default({}) | dict2items | selectattr('key', 'in', desired_iscsi.keys() | list) | items2dict) != desired_iscsi
  no_log: true
