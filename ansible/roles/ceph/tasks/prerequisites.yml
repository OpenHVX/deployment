---
- name: Download cephadm
  ansible.builtin.get_url:
    url: https://download.ceph.com/rpm-squid/el9/noarch/cephadm
    dest: /usr/local/sbin/cephadm
    mode: '0755'
# Report both runtime loading and persistent configuration honestly. A second
# run should stay unchanged when the modules and file already match.
- name: Load the iSCSI gateway kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [target_core_user, iscsi_target_mod]

- name: Load the gateway modules after reboot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/openhvx-iscsi.conf
    content: |
      target_core_user
      iscsi_target_mod
    mode: '0644'

- name: Inspect dedicated OSD disk
  ansible.builtin.command: lsblk -b -ndo SIZE /dev/sdb
  register: osd_size
  changed_when: false
- name: Require the declared dedicated OSD device
  ansible.builtin.assert:
    that: osd_size.stdout | int == 60 * 1024 * 1024 * 1024
