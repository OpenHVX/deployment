---
- name: Read and validate the owned instance without mutation
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', playbook_dir + '/../powershell/Get-VyosVM.ps1') }}"
    parameters:
      Name: "{{ vyos_hosts[inventory_hostname].name }}"
      DeploymentId: "{{ vyos_deployment_id }}"
  register: vyos_inspection
- name: Record instance identity on the deployment controller
  ansible.builtin.copy:
    content: "{{ vyos_inspection.output | to_nice_json }}"
    dest: "{{ vyos_status_dir }}/{{ inventory_hostname }}.json"
    mode: '0600'
  delegate_to: localhost
