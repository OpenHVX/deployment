---
# A seed is immutable bootstrap input. Existing guests must never silently retain
# a different seed when the inventory declares a new one.
- name: Ensure declared infrastructure VMs without replacing existing disks
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', playbook_dir + '/../powershell/Ensure-InfrastructureVM.ps1') }}"
    parameters:
      VerifyExistingSeed: true
      ResumePreparedDisk: "{{ infra_resume_disks | default(false) | bool }}"
      Name: "{{ item.name }}"
      ImageUrl: "{{ infra_media_url }}/ubuntu.vhdx"
      ImageSha256: "{{ infra_image_sha256 }}"
      SeedUrl: "{{ infra_media_url }}/{{ item.seed }}"
      SeedSha256: "{{ item.seed_sha256 }}"
      SystemGiB: "{{ item.system_gib }}"
      DataGiB: "{{ item.data_gib }}"
  loop: "{{ infra_hosts[inventory_hostname].infra_vms }}"
