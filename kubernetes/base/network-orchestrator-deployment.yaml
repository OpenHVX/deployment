apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-orchestrator
  namespace: openhvx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: network-orchestrator
  template:
    metadata:
      labels:
        app: network-orchestrator
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: network-orchestrator
            topologyKey: kubernetes.io/hostname
      containers:
      - name: network-orchestrator
        image: openhvx/network-orchestrator:unconfigured
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3002
        envFrom:
        - secretRef:
            name: network-orchestrator-env
        # A running process is not necessarily connected to MongoDB/RabbitMQ.
        # Gate admission on the worker's own readiness endpoint before maintenance
        # can reopen public API traffic.
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3002
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /healthz
            port: 3002
          failureThreshold: 60
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 768Mi
      terminationGracePeriodSeconds: 45
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
