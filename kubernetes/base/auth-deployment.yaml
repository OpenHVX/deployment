apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: openhvx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: auth
            topologyKey: kubernetes.io/hostname
      containers:
      - name: auth
        image: openhvx/auth:unconfigured
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
        envFrom:
        - secretRef:
            name: auth-env
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 768Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 4000
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /healthz
            port: 4000
          failureThreshold: 60
          periodSeconds: 5
      terminationGracePeriodSeconds: 45
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
