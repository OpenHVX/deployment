apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceph-connector
  namespace: openhvx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ceph-connector
  template:
    metadata:
      labels:
        app: ceph-connector
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: ceph-connector
            topologyKey: kubernetes.io/hostname
      containers:
      - name: ceph-connector
        image: openhvx/ceph-connector:unconfigured
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: ceph-connector-env
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 768Mi
        volumeMounts:
        - name: trust
          mountPath: /trust
          readOnly: true
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          periodSeconds: 10
      terminationGracePeriodSeconds: 45
      volumes:
      - name: trust
        configMap:
          name: lab-ca
  strategy:
    type: Recreate
