# Temporary maintenance resources, deliberately outside the normal Kustomize base.
# A rollout must not remove the gate while it reapplies the regular Ingress.
# Use Traefik's built-in dummy service. Depending on a rolling application service
# could make this route disappear when that service has no endpoints.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: openhvx-maintenance
  namespace: openhvx
spec:
  ipAllowList:
    # TEST-NET-1 cannot be a legitimate source on this private management network.
    # Default RemoteAddr matching is intentional: do not trust forwarded headers.
    sourceRange:
      - 192.0.2.0/32
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openhvx-maintenance
  namespace: openhvx
spec:
  entryPoints: [websecure]
  routes:
    - match: PathPrefix(`/api`)
      kind: Rule
      priority: 10000
      middlewares:
        - name: openhvx-maintenance
      services:
        - name: noop@internal
          kind: TraefikService
  tls:
    secretName: ingress-tls
