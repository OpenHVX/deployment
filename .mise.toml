[tools]
opentofu = "1.8.8"
python = "3.12.10"
jq = "1.7.1"
yq = "4.44.2"
age = "1.2.1"
sops = "3.9.4"
kustomize = "5.7.1"

[env]
_.path = ["{{config_root}}/.venv/bin"]

[tasks.bootstrap]
run = "./scripts/bootstrap.sh"

[tasks."check:host"]
run = "./lab/scripts/check-host.sh"

[tasks."tofu:init"]
run = "./lab/scripts/tofu-init.sh"

[tasks."tofu:plan"]
run = "./lab/scripts/tofu-plan.sh"

[tasks."tofu:apply"]
run = "./scripts/with-lab-lock.sh ./lab/scripts/tofu-apply.sh"

[tasks."ansible:bootstrap"]
run = "./scripts/with-lab-lock.sh ./lab/scripts/ansible-bootstrap.sh"

[tasks."ansible:configure"]
run = "./scripts/with-lab-lock.sh ./lab/scripts/run-platform.sh"

[tasks."lab:up"]
run = "./scripts/with-lab-lock.sh ./lab/scripts/lab-up.sh"

[tasks."lab:down"]
run = "./scripts/with-lab-lock.sh ./lab/scripts/lab-down.sh"

[tasks.test]
run = "./scripts/test.sh"

[tasks."inventory:generate"]
run = "./scripts/with-lab-lock.sh ./lab/scripts/inventory-generate.sh"

[tasks."windows:prepare"]
run = "./scripts/with-lab-lock.sh python lab/scripts/prepare-windows.py"

[tasks."test:lab"]
run = "./scripts/with-lab-lock.sh ./lab/scripts/test-lab.sh"

[tasks."ansible:rdp"]
run = "./scripts/with-lab-lock.sh env PLATFORM_PLAYBOOK=ansible/playbooks/rdp.yml ./lab/scripts/run-platform.sh"

[tasks."lab:hosts:up"]
run = "./scripts/with-lab-lock.sh ./lab/scripts/lab-hosts-up.sh"

[tasks."platform:deploy"]
run = "./scripts/deploy.sh"

[tasks."platform:verify"]
run = "PLATFORM_PLAYBOOK=ansible/playbooks/verify.yml ./scripts/deploy.sh"

[tasks."lab:platform:up"]
run = "./scripts/with-lab-lock.sh python lab/scripts/platform-up.py"

[tasks."lab:platform:verify"]
run = "./scripts/with-lab-lock.sh python lab/scripts/smoke-api.py"

[tasks."lab:platform:storage-test"]
run = "./scripts/with-lab-lock.sh python -u lab/scripts/smoke-storage.py --run stable"

[tasks."lab:platform:failover-test"]
run = "./scripts/with-lab-lock.sh python -u lab/scripts/check-failover.py"

[tasks."lab:platform:backup"]
run = "./scripts/with-lab-lock.sh python lab/scripts/backup-platform.py"

[tasks."lab:network:plan"]
run = "python lab/scripts/prepare-vyos.py --plan"

[tasks."lab:network:deploy"]
run = "./scripts/with-lab-lock.sh python lab/scripts/deploy-network-poc.py"

[tasks."lab:network:verify"]
run = "./scripts/with-lab-lock.sh python lab/scripts/smoke-network.py"

[tasks."lab:network:vyos-up"]
run = "./scripts/with-lab-lock.sh python lab/scripts/vyos-up.py"

[tasks."lab:network:inspect"]
run = "python lab/scripts/inspect-network.py"

[tasks."lab:network:vyos-image"]
run = "./scripts/with-lab-lock.sh python image-builds/vyos/build.py"

[tasks."lab:network:vyos-status"]
run = "python lab/scripts/vyos-status.py"

[tasks."lab:network:vyos-verify"]
run = "python lab/scripts/verify-vyos.py"

[tasks."lab:network:vyos-down"]
run = "./scripts/with-lab-lock.sh python lab/scripts/vyos-down.py"

[tasks."lab:images:build"]
run = "./scripts/with-lab-lock.sh python lab/scripts/build-images.py"

[tasks."lab:infrastructure:up"]
run = "./scripts/with-lab-lock.sh python lab/scripts/platform-up.py --infrastructure-only"

[tasks."kubernetes:inspect"]
run = "kustomize build kubernetes/overlays/lab"

[tasks."kubernetes:render"]
run = "./scripts/with-lab-lock.sh python kubernetes/render.py --work .lab/infra --ca .lab/ca.pem"

[tasks."lab:maintenance:resume"]
run = "python lab/scripts/maintenance.py"

[tasks."lab:maintenance:enter"]
run = "python lab/scripts/maintenance.py enter"
